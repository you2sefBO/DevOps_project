apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-fastapi-app
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: my-fastapi-app
  template:
    metadata:
      labels:
        app: my-fastapi-app
    spec:
      containers:
      - name: server
        image: youssef348/my-devops-project:latest
        imagePullPolicy: Always 
        ports:
        - containerPort: 8000
